<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slipstream</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d10;
      }
      canvas {
        display: block;
      }
      #debug {
        position: fixed;
        top: 12px;
        left: 12px;
        padding: 10px 14px;
        font:
          12px/1.6 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        color: #d7e3ee;
        background: rgba(10, 14, 20, 0.72);
        border: 1px solid rgba(140, 170, 200, 0.22);
        border-radius: 6px;
        white-space: pre;
        pointer-events: none;
        user-select: none;
      }
      #debug[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="debug"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
